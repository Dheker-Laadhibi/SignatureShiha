<div class="container">
  <h2 class="title">Signature Verification</h2>
  <form (ngSubmit)="onSubmit()" #signatureForm="ngForm" enctype="multipart/form-data" class="form">
    <div class="form-group">
      <label for="email">Email:</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        [(ngModel)]="email" 
        class="form-control" 
        required 
        email
        placeholder="Enter client email"
      >
    </div>

    <div class="form-group">
      <label for="image">Signature Image:</label>
      <input 
        type="file" 
        id="image" 
        name="image" 
        (change)="onFileSelected($event)" 
        accept="image/*" 
        class="form-control"
        required
      >
    </div>

    <div class="button-container">
      <button 
        type="submit" 
        class="btn btn-primary" 
        [disabled]="!signatureForm.valid || isLoading"
      >
        {{ isLoading ? 'Verifying...' : 'Verify Signature' }}
      </button>
    </div>
  </form>

  <div *ngIf="result" class="result-container" [ngClass]="{'genuine-background': result.prediction === 'Genuine', 'forged-background': result.prediction === 'Forged'}">
    <h3>Verification Result</h3>
    <p><strong>Client:</strong> {{ result.client }}</p>
    <p><strong>Prediction:</strong> <span [ngClass]="{'genuine': result.prediction === 'Genuine', 'forged': result.prediction === 'Forged'}">{{ result.prediction }}</span></p>
    <p><strong>Confidence:</strong> {{ result.confidence }}</p>
  </div>

  <div *ngIf="error" class="error-container">
    <p class="error">{{ error }}</p>
  </div>
</div>
